<!-- @format -->

{% extends "admin/layout.html" %} {% block title %}Chỉnh sửa Quyền hạn{%
endblock %} {% block content %}
<div class="container-xxl">
    <div class="py-3 d-flex align-items-sm-center flex-sm-row flex-column">
        <div class="flex-grow-1">
            <h4 class="fs-18 fw-semibold m-0">Chỉnh sửa Quyền hạn</h4>
        </div>
        <div class="text-end">
            <ol class="breadcrumb m-0 py-0">
                <li class="breadcrumb-item">
                    <a href="/admin/permissions/get-list"
                        >Danh sách Quyền hạn</a
                    >
                </li>
                <li class="breadcrumb-item active">Chỉnh sửa</li>
            </ol>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form id="form-edit-permission">
                <input type="hidden" name="id" />
                <div class="mb-3">
                    <label class="form-label">Tên quyền</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        required
                    />
                </div>
                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea
                        name="desc"
                        rows="3"
                        class="form-control"
                        placeholder="Nhập mô tả quyền hạn..."
                        
                    ></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                    Lưu thay đổi
                </button>
                <a href="/admin/permissions/get-list" class="btn btn-secondary"
                    >Huỷ</a
                >
            </form>
        </div>
    </div>
</div>
{% endblock %} {% block extra_js %}
<script>
    const permId = window.location.pathname.split('/').pop();

    if (!/^\d+$/.test(permId)) {
        window.location.href = '/admin/permissions/get-list';
    }

    // Load thông tin quyền hạn
    fetch(`/api/admin/rbac/permissions/get-one/${permId}`)
        .then((res) => res.json())
        .then(({ success, data }) => {
            if (!success) throw new Error('Không tìm thấy quyền hạn');

            document.querySelector('[name="id"]').value = data.id;
            document.querySelector('[name="name"]').value = data.name;
            document.querySelector('[name="desc"]').value = data.desc || '';
        })
        .catch((err) => {
            Swal.fire({
                icon: 'error',
                title: 'Lỗi tải dữ liệu',
                text: err.message,
            }).then(
                () => (window.location.href = '/admin/permissions/get-list')
            );
        });

    // Gửi form cập nhật
    document
        .getElementById('form-edit-permission')
        ?.addEventListener('submit', function (e) {
            e.preventDefault();
            const form = e.target;
            const name = form.name.value.trim();
            const desc = form.desc.value.trim();

            if (!name) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Vui lòng nhập tên quyền',
                });
                return;
            }

            fetch(`/api/admin/rbac/permissions/update/${permId}`, {
                method: 'POST',
                body: new URLSearchParams({ name, desc }),
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
            })
                .then((res) => res.json())
                .then(({ success, message }) => {
                    if (success) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Cập nhật thành công!',
                        }).then(() => {
                            window.location.href =
                                '/admin/permissions/get-list';
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Lỗi',
                            text: message || 'Không thể cập nhật quyền hạn',
                        });
                    }
                })
                .catch((err) => {
                    Swal.fire({
                        icon: 'error',
                        title: 'Lỗi hệ thống',
                        text: err.message,
                    });
                });
        });
</script>
{% endblock %}
