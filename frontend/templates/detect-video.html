<!-- @format -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Video Fire Detection</title>
        {% include ('partials/head.html')%}
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
        />
        <style>
            #videoDropArea:hover {
                border-color: #0d6efd;
                box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
            }
            .client-area {
                padding: 50px 0;
            }
        </style>
    </head>
    <body>
        <!-- Start Navbar Sidebar Area -->
        {% include ('partials/narvar_sidebar.html') %}
        <!-- End Navbar Sidebar Modal -->
        <div class="client-area ptb-50">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <h2 class="text-center mb-4">
                            Phát hiện cháy từ video
                        </h2>
                    </div>
                </div>
                <div class="row">
                    <!-- Left: Video Upload Area (8 columns) -->
                    <div class="col-lg-8 mb-4">
                        <div
                            id="videoDropArea"
                            class="position-relative border border-2 border-primary rounded bg-white shadow-sm"
                            style="aspect-ratio: 16/9; cursor: pointer"
                        >
                            <input
                                type="file"
                                id="videoUpload"
                                accept="video/mp4"
                                style="
                                    opacity: 0;
                                    width: 100%;
                                    height: 100%;
                                    position: absolute;
                                    top: 0;
                                    left: 0;
                                    z-index: 3;
                                    cursor: pointer;
                                "
                            />
                            <video
                                id="previewVideo"
                                controls
                                class="position-absolute top-0 start-0 w-100 h-100"
                                style="
                                    z-index: 2;
                                    object-fit: contain;
                                    display: none;
                                    background: #000;
                                "
                            ></video>
                            <canvas
                                id="uploadCanvas"
                                class="position-absolute top-0 start-0"
                                style="
                                    z-index: 10;
                                    pointer-events: none;
                                    display: none;
                                "
                            ></canvas>
                            <div
                                id="uploadPrompt"
                                class="position-absolute top-50 start-50 translate-middle text-center text-muted"
                                style="z-index: 1"
                            >
                                <i
                                    class="bi bi-cloud-arrow-up-fill display-3 text-primary mb-2"
                                ></i>
                                <p class="m-0">
                                    <strong>Kéo thả video MP4 vào đây</strong
                                    ><br />
                                    hoặc bấm để chọn từ thiết bị
                                </p>
                            </div>
                        </div>
                        <div class="text-end mt-2">
                            <button
                                id="resetVideoBtn"
                                class="btn btn-outline-secondary btn-sm d-none"
                            >
                                <i class="bi bi-arrow-repeat"></i> Chọn lại
                                video
                            </button>
                        </div>
                    </div>

                    <!-- Right: Model Selection (4 columns) -->
                    <div class="col-lg-4">
                        <h5 class="mb-3">Chọn mô hình</h5>
                        <select id="modelSelect" class="form-select mb-3">
                            <option disabled selected>
                                -- Đang tải mô hình... --
                            </option>
                        </select>
                        <button
                            id="detectBtn"
                            class="btn btn-primary w-100"
                            disabled
                        >
                            Bắt đầu
                        </button>
                        <div id="status" class="mt-3 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer Area -->
        {% include ('partials/footer.html') %}
        <!-- Footer Area End -->

        <!-- Jquery Min JS -->
        <script src="/static/assets/js/jquery.min.js"></script>
        <!-- Bootstrap Bundle Min JS -->
        <script src="/static/assets/js/bootstrap.bundle.min.js"></script>
        <!-- Meanmenu JS -->
        <script src="/static/assets/js/meanmenu.min.js"></script>
        <!-- Owl Carousel JS -->
        <script src="/static/assets/js/owl.carousel.min.js"></script>
        <!-- Magnific Popup JS -->
        <script src="/static/assets/js/jquery.magnific-popup.min.js"></script>
        <!-- Wow JS -->
        <script src="/static/assets/js/wow.min.js"></script>
        <!-- Ajaxchimp Min JS -->
        <script src="/static/assets/js/jquery.ajaxchimp.min.js"></script>
        <!-- Form Validator Min JS -->
        <script src="/static/assets/js/form-validator.min.js"></script>
        <!-- Contact Form JS -->
        <script src="/static/assets/js/contact-form-script.js"></script>
        <!-- Custom JS -->
        <script src="/static/assets/js/custom.js"></script>
        <script>
            const videoInput = document.getElementById('videoUpload');
            const videoPreview = document.getElementById('previewVideo');
            const uploadPrompt = document.getElementById('uploadPrompt');
            const resetBtn = document.getElementById('resetVideoBtn');
            const modelSelect = document.getElementById('modelSelect');
            const detectBtn = document.getElementById('detectBtn');
            const uploadCanvas = document.getElementById('uploadCanvas');
            const uploadCtx = uploadCanvas.getContext('2d');
            const status = document.getElementById('status');

            let isDetecting = false;
            let lastBoxes = [];

            // ✅ Cập nhật kích thước canvas chính xác
            function updateCanvasSize() {
                // Canvas sẽ có kích thước bằng container để overlay chính xác
                const containerRect = videoPreview.getBoundingClientRect();
                uploadCanvas.width = containerRect.width;
                uploadCanvas.height = containerRect.height;
                uploadCanvas.style.width = containerRect.width + 'px';
                uploadCanvas.style.height = containerRect.height + 'px';
            }

            // ✅ Tính toán tỷ lệ scale từ video gốc sang hiển thị
            function getVideoScale() {
                if (!videoPreview.videoWidth || !videoPreview.videoHeight) {
                    return { scaleX: 1, scaleY: 1, offsetX: 0, offsetY: 0 };
                }

                const videoAspect =
                    videoPreview.videoWidth / videoPreview.videoHeight;
                const displayAspect =
                    videoPreview.clientWidth / videoPreview.clientHeight;

                let scaleX,
                    scaleY,
                    offsetX = 0,
                    offsetY = 0;

                if (displayAspect > videoAspect) {
                    // Video có thanh đen hai bên
                    scaleY =
                        videoPreview.clientHeight / videoPreview.videoHeight;
                    scaleX = scaleY;
                    const actualWidth = videoPreview.videoWidth * scaleX;
                    offsetX = (videoPreview.clientWidth - actualWidth) / 2;
                } else {
                    // Video có thanh đen trên dưới
                    scaleX = videoPreview.clientWidth / videoPreview.videoWidth;
                    scaleY = scaleX;
                    const actualHeight = videoPreview.videoHeight * scaleY;
                    offsetY = (videoPreview.clientHeight - actualHeight) / 2;
                }

                return { scaleX, scaleY, offsetX, offsetY };
            }

            // Load model list from API
            fetch('/api/models/get_all')
                .then((res) => res.json())
                .then((data) => {
                    if (data.models) {
                        modelSelect.innerHTML = '';
                        data.models.forEach((m) => {
                            const opt = document.createElement('option');
                            opt.value = m.model_id;
                            opt.textContent = m.model_name;
                            modelSelect.appendChild(opt);
                        });
                        modelSelect.value = data.models[0].model_id;
                    }
                })
                .catch((error) => {
                    console.error('Error loading models:', error);
                    // Fallback to mock data if API fails
                    modelSelect.innerHTML = `
                        <option value="1">YOLOv8 Fire Detection</option>
                        <option value="2">Custom Fire Model</option>
                    `;
                    modelSelect.value = '1';
                });

            modelSelect.addEventListener('change', () => {
                detectBtn.disabled = !videoPreview.src;
            });

            videoInput.addEventListener('click', () => (videoInput.value = ''));
            videoInput.addEventListener('change', () => {
                const file = videoInput.files[0];
                if (!file) return;

                // ✅ Reset lại video hoàn toàn trước khi gán mới
                videoPreview.pause();
                videoPreview.removeAttribute('src');
                videoPreview.load();

                const url = URL.createObjectURL(file);
                videoPreview.src = url;
                videoPreview.style.display = 'block';
                uploadPrompt.style.display = 'none';
                videoInput.style.pointerEvents = 'none';
                resetBtn.classList.remove('d-none');
                detectBtn.disabled = !modelSelect.value;

                videoPreview.addEventListener('loadedmetadata', () => {
                    updateCanvasSize();
                    uploadCanvas.style.display = 'block';
                });

                window.addEventListener('resize', updateCanvasSize);
            });

            resetBtn.addEventListener('click', () => {
                // Ngừng video
                videoPreview.pause();

                // Gỡ bỏ URL cũ
                if (videoPreview.src && videoPreview.src.startsWith('blob:')) {
                    URL.revokeObjectURL(videoPreview.src);
                }

                // Reset src và load lại
                videoPreview.removeAttribute('src');
                videoPreview.load();

                // ✅ Ẩn thẻ video, hiện prompt ban đầu
                videoPreview.style.display = 'none';
                uploadPrompt.style.display = 'block';

                // ✅ Ẩn canvas và reset form
                uploadCanvas.style.display = 'none';
                videoInput.value = '';
                videoInput.style.pointerEvents = 'auto';
                resetBtn.classList.add('d-none');
                detectBtn.disabled = true;

                // ✅ Reset logic
                isDetecting = false;
                lastBoxes = [];
                status.innerHTML = '';
            });

            // ✅ Gửi frame để detect (real API call)
            async function detectFrame(imageData) {
                const modelId = modelSelect.value;

                try {
                    const res = await fetch('/api/predict/detect_video_frame', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image: imageData,
                            model_id: modelId,
                        }),
                    });

                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }

                    const data = await res.json();
                    lastBoxes = data.detections || [];
                } catch (error) {
                    console.error('Detection error:', error);
                    lastBoxes = [];
                    status.innerHTML =
                        '<span class="text-danger">❌ Lỗi kết nối API</span>';
                }
            }

            // ✅ Vẽ bounding boxes với tỷ lệ chính xác
            function drawBoundingBoxes() {
                uploadCtx.clearRect(
                    0,
                    0,
                    uploadCanvas.width,
                    uploadCanvas.height
                );

                if (lastBoxes.length === 0) return;

                const { scaleX, scaleY, offsetX, offsetY } = getVideoScale();

                lastBoxes.forEach(({ bbox, confidence, label }) => {
                    const [x1, y1, x2, y2] = bbox;

                    // ✅ Chuyển từ tọa độ video gốc sang tọa độ hiển thị
                    const displayX1 = x1 * scaleX + offsetX;
                    const displayY1 = y1 * scaleY + offsetY;
                    const displayX2 = x2 * scaleX + offsetX;
                    const displayY2 = y2 * scaleY + offsetY;

                    const width = displayX2 - displayX1;
                    const height = displayY2 - displayY1;

                    // Vẽ bbox
                    uploadCtx.strokeStyle = '#ff0000';
                    uploadCtx.lineWidth = 2;
                    uploadCtx.strokeRect(displayX1, displayY1, width, height);

                    // Vẽ label
                    const labelText = `🔥 ${label} ${(confidence * 100).toFixed(
                        1
                    )}%`;
                    uploadCtx.fillStyle = '#ff0000';
                    uploadCtx.font = '14px Arial';

                    // Background cho text
                    const textMetrics = uploadCtx.measureText(labelText);
                    uploadCtx.fillStyle = 'rgba(255, 0, 0, 0.8)';
                    uploadCtx.fillRect(
                        displayX1,
                        displayY1 - 20,
                        textMetrics.width + 8,
                        20
                    );

                    // Text
                    uploadCtx.fillStyle = '#ffffff';
                    uploadCtx.fillText(labelText, displayX1 + 4, displayY1 - 6);
                });
            }

            // ✅ Main detection loop
            function drawLoop() {
                if (!isDetecting || videoPreview.paused || videoPreview.ended) {
                    return;
                }

                drawBoundingBoxes();

                // Gửi frame mới mỗi 300ms để tránh spam
                const now = Date.now();
                if (
                    !drawLoop.lastDetectTime ||
                    now - drawLoop.lastDetectTime > 300
                ) {
                    drawLoop.lastDetectTime = now;

                    // Tạo canvas để capture frame hiện tại
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = videoPreview.videoWidth;
                    tempCanvas.height = videoPreview.videoHeight;
                    const ctx = tempCanvas.getContext('2d');
                    ctx.drawImage(videoPreview, 0, 0);
                    const imageData = tempCanvas.toDataURL('image/jpeg', 0.8);

                    detectFrame(imageData);
                }

                requestAnimationFrame(drawLoop);
            }

            // ✅ Event listeners
            detectBtn.addEventListener('click', () => {
                if (!videoPreview.src || isDetecting) return;

                isDetecting = true;
                videoPreview.play();
                drawLoop();
                detectBtn.textContent = 'Đang phát hiện...';
                detectBtn.disabled = true;
                status.innerHTML =
                    '<span class="text-success">🔴 Đang phát hiện cháy...</span>';
            });

            videoPreview.addEventListener('pause', () => {
                isDetecting = false;
                detectBtn.textContent = 'Tiếp tục';
                detectBtn.disabled = false;
                status.innerHTML =
                    '<span class="text-warning">⏸️ Tạm dừng</span>';
            });

            videoPreview.addEventListener('ended', () => {
                isDetecting = false;
                detectBtn.textContent = 'Bắt đầu';
                detectBtn.disabled = false;
                status.innerHTML =
                    '<span class="text-info">✅ Hoàn thành</span>';
            });

            videoPreview.addEventListener('play', () => {
                if (!isDetecting) {
                    isDetecting = true;
                    drawLoop();
                    detectBtn.textContent = 'Đang phát hiện...';
                    detectBtn.disabled = true;
                    status.innerHTML =
                        '<span class="text-success">🔴 Đang phát hiện cháy...</span>';
                }
            });
        </script>
    </body>
</html>
