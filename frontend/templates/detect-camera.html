<!-- @format -->

<!DOCTYPE html>
<html lang="en">
    <head>
        {% include ('partials/head.html')%}
        <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
        <style>
            @media (max-width: 768px) and (orientation: portrait) {
                #main-flex {
                    flex-direction: column !important;
                    align-items: center !important; /* Căn giữa ngang */
                }

                #main-flex > div:first-child {
                    order: 2; /* Camera xuống dưới */
                }

                #main-flex > div:last-child {
                    order: 1; /* Stats lên trên */
                    width: 100%;
                    max-width: 360px; /* Hoặc giữ 320px */
                }
            }
        </style>
        <link
            href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
            rel="stylesheet"
        />
        <style>
            /* Làm input lớn hơn và dễ nhìn hơn */
            .select2-container--default .select2-selection--single {
                height: 48px;
                padding: 10px 12px;
                font-size: 16px;
                border-radius: 8px;
                border: 1px solid #ccc;
                display: flex;
                align-items: center;
            }

            /* Phần dropdown kết quả */
            .select2-results__option {
                padding: 10px;
                font-size: 14px;
            }

            /* Khi chọn rồi */
            .select2-selection__rendered {
                line-height: 1.4;
            }
            /* ✅ Khi hover chọn: xám nhạt như select mặc định */
            .select2-results__option--highlighted {
                background-color: #e9ecef !important;
                color: #000 !important;
            }
            /* Đảm bảo badge xuống dòng đẹp */
            .select2-results__option span.badge {
                display: inline-block;
                margin-bottom: 4px;
            }
        </style>
    </head>
    <body>
        <!-- Start Navbar Sidebar Area -->
        {% include ('partials/narvar_sidebar.html') %}

        <!-- Client Area -->
        <div class="container-fluid py-4 px-3">
            <div class="d-flex flex-row gap-3" id="main-flex">
                <!-- Camera Area chiếm toàn bộ phần còn lại -->
                <div class="flex-grow-1 position-relative">
                    <div
                        class="video-area position-relative"
                        style="aspect-ratio: 16/9; width: 100%"
                    >
                        <video
                            id="video"
                            autoplay
                            muted
                            playsinline
                            class="w-100 h-100 object-fit-cover"
                        ></video>
                        <canvas
                            id="canvas"
                            class="position-absolute top-0 start-0 w-100 h-100"
                        ></canvas>
                        <canvas id="temp-canvas" style="display: none"></canvas>

                        <button
                            id="fullscreen-btn"
                            class="btn btn-dark btn-sm position-absolute bottom-0 end-0 m-2 z-3"
                        >
                            <i class="fas fa-expand"></i> Toàn màn hình
                        </button>
                    </div>
                </div>

                <!-- Stats & Controls -->
                <div style="width: 320px; max-width: 100%">
                    <div class="card shadow">
                        <div class="card-body">
                            <h5 class="card-title text-center">📊 Thống kê</h5>
                            <div
                                id="status"
                                class="alert alert-secondary text-center"
                            >
                                🥒 Vui lòng nhấn "Bắt đầu"
                            </div>
                            <ul class="list-group mb-3">
                                <li class="list-group-item">
                                    Khung hình: <span id="frame-count">0</span>
                                </li>
                                <li class="list-group-item">
                                    Phát hiện: <span id="detect-count">0</span>
                                </li>
                                <!-- <li class="list-group-item">
                                    FPS: <span id="fps">0</span>
                                </li> -->
                                <li class="list-group-item">
                                    Thời gian: <span id="uptime">0s</span>
                                </li>
                            </ul>
                            <div class="mb-3">
                                <label for="camera-select" class="form-label"
                                    >Chọn Camera:</label
                                >
                                <select
                                    id="camera-select"
                                    class="form-select"
                                ></select>
                            </div>
                            <div class="mb-3">
                                <label for="model-select" class="form-label"
                                    >Chọn Model:</label
                                >
                                <select
                                    id="model-select"
                                    class="form-select"
                                ></select>
                                <!-- Tooltip hiển thị sau khi chọn -->
                                <div
                                    id="model-info"
                                    class="mt-2"
                                    style="display: none"
                                >
                                    <div class="fw-bold">Tag:</div>
                                    <span id="model-tag"></span>
                                    <div class="fw-bold mt-2">Giải thích:</div>
                                    <div
                                        id="model-tooltip"
                                        class="text-muted small"
                                    ></div>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button id="start-btn" class="btn btn-success">
                                    Bắt đầu
                                </button>
                                <button
                                    id="stop-btn"
                                    class="btn btn-danger"
                                    style="display: none"
                                >
                                    Dừng
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Client Area End -->

        <!-- Footer Area -->
        {% include ('partials/footer.html') %}
        <!-- Footer Area End -->

        <!-- Jquery Min JS -->
        <script src="/static/assets/js/jquery.min.js"></script>
        <!-- Bootstrap Bundle Min JS -->
        <script src="/static/assets/js/bootstrap.bundle.min.js"></script>
        <!-- Meanmenu JS -->
        <script src="/static/assets/js/meanmenu.min.js"></script>
        <!-- Owl Carousel JS -->
        <script src="/static/assets/js/owl.carousel.min.js"></script>
        <!-- Magnific Popup JS -->
        <script src="/static/assets/js/jquery.magnific-popup.min.js"></script>
        <!-- Wow JS -->
        <script src="/static/assets/js/wow.min.js"></script>
        <!-- Ajaxchimp Min JS -->
        <script src="/static/assets/js/jquery.ajaxchimp.min.js"></script>
        <!-- Form Validator Min JS -->
        <script src="/static/assets/js/form-validator.min.js"></script>
        <!-- Contact Form JS -->
        <script src="/static/assets/js/contact-form-script.js"></script>
        <!-- Custom JS -->
        <script src="/static/assets/js/custom.js"></script>

        <!-- Dự đoán ảnh -->
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <script>
            const socket = io();
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const tempCanvas = document.getElementById('temp-canvas');
            const tempCtx = tempCanvas.getContext('2d');
            const cameraSelect = document.getElementById('camera-select');
            const modelSelect = document.getElementById('model-select'); // Thêm biến cho select model
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            const statusEl = document.getElementById('status');
            const frameCountEl = document.getElementById('frame-count');
            const detectCountEl = document.getElementById('detect-count');
            const fpsEl = document.getElementById('fps');
            const uptimeEl = document.getElementById('uptime');

            let currentStream;
            let interval;
            let startTime = Date.now();
            let frameCount = 0;
            let detectCount = 0;
            let currentDbDeviceId = null;

            // Hàm gửi thông tin thiết bị lên backend để lưu/cập nhật
            async function saveDeviceToBackend(selectedDeviceId, devName) {
                const deviceData = {
                    dev_name: devName,
                    user_id: 1, // Thay bằng user_id thực của bạn
                    dev_hardware_id: selectedDeviceId, // Gửi deviceId (chuỗi) từ trình duyệt
                };

                return new Promise((resolve, reject) => {
                    socket.emit('save_device', deviceData);
                    socket.once('save_device_response', (data) => {
                        if (data.status === 'success' && data.dev_id) {
                            currentDbDeviceId = data.dev_id;
                            console.log(
                                `Device saved/updated. Hardware ID: ${selectedDeviceId} -> DB ID: ${currentDbDeviceId}`
                            );
                            resolve(data.dev_id);
                        } else {
                            console.error(
                                'Error saving device or no dev_id returned:',
                                data.message
                            );
                            reject(
                                new Error(
                                    data.message ||
                                        'Unknown error saving device.'
                                )
                            );
                        }
                    });
                });
            }

            // Hàm để tải và liệt kê các model từ backend
            async function listModels() {
                console.log('Attempting to get models from backend...');
                return new Promise((resolve, reject) => {
                    socket.emit('get_models');
                    socket.once('models_list', (data) => {
                        console.log('Received models_list event:', data); // LOG NÀY QUAN TRỌNG
                        modelSelect.innerHTML = '';
                        if (
                            data.status === 'success' &&
                            data.models &&
                            data.models.length > 0
                        ) {
                            // Thêm kiểm tra data.models
                            data.models.forEach((model) => {
                                const option = document.createElement('option');
                                option.value = model.model_id;
                                option.text = model.model_name;
                                option.dataset.tooltip =
                                    model.model_tooltip || '';
                                option.dataset.tag =
                                    model.model_short_title || '';
                                modelSelect.appendChild(option);
                            });

                            resolve();
                        } else {
                            const option = document.createElement('option');
                            option.text =
                                data.message || 'Không tìm thấy model'; // Hiển thị thông báo nếu có
                            modelSelect.appendChild(option);
                            startBtn.disabled = true;
                            console.error(
                                'Error fetching models or no models found:',
                                data.message
                            );
                            reject(
                                new Error(data.message || 'No models found.')
                            );
                        }
                    });
                    socket.once('error', (data) => {
                        console.error(
                            "Socket.IO 'error' event during model fetch:",
                            data.message
                        ); // LOG NÀY QUAN TRỌNG
                        const option = document.createElement('option');
                        option.text = `Lỗi tải model: ${data.message}`;
                        modelSelect.appendChild(option);
                        startBtn.disabled = true;
                        reject(new Error(data.message));
                    });
                });
            }

            async function listCameras() {
                try {
                    // Bắt buộc yêu cầu quyền camera để có deviceId đầy đủ
                    await navigator.mediaDevices.getUserMedia({ video: true });

                    const devices =
                        await navigator.mediaDevices.enumerateDevices();
                    const videoDevices = devices.filter(
                        (device) => device.kind === 'videoinput'
                    );

                    cameraSelect.innerHTML = '';
                    if (videoDevices.length === 0) {
                        const option = document.createElement('option');
                        option.text = 'Không tìm thấy camera';
                        cameraSelect.appendChild(option);
                        startBtn.disabled = true;
                        return;
                    }

                    videoDevices.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.deviceId || ''; // tránh null
                        option.text = device.label || `Camera ${index + 1}`;
                        cameraSelect.appendChild(option);
                    });

                    const initialSelectedDeviceId = cameraSelect.value;
                    const initialDevName =
                        cameraSelect.options[cameraSelect.selectedIndex].text;

                    // ✅ Chỉ gửi nếu deviceId không rỗng
                    if (
                        initialSelectedDeviceId &&
                        initialSelectedDeviceId.trim() !== ''
                    ) {
                        await saveDeviceToBackend(
                            initialSelectedDeviceId,
                            initialDevName
                        );
                    } else {
                        console.warn('⚠️ Không có deviceId hợp lệ.');
                        statusEl.textContent =
                            '❌ Không thể lấy mã thiết bị camera.';
                        statusEl.className = 'status error';
                        startBtn.disabled = true;
                    }
                } catch (err) {
                    console.error(
                        '❌ Lỗi khi truy cập camera hoặc liệt kê:',
                        err
                    );
                    statusEl.textContent =
                        '❌ Lỗi: Không thể truy cập camera. Vui lòng đăng nhập để tiếp tục.';
                    statusEl.className = 'status error';
                    startBtn.disabled = true;
                }
            }

            async function startCamera(id) {
                if (currentStream) stopCamera();

                const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

                const constraints = isIOS
                    ? {
                          video: {
                              facingMode: { ideal: 'environment' }, // camera sau cho iOS
                          },
                          audio: false,
                      }
                    : {
                          video: { deviceId: id ? { exact: id } : undefined },
                          audio: false,
                      };

                try {
                    const stream = await navigator.mediaDevices.getUserMedia(
                        constraints
                    );
                    video.srcObject = stream;
                    currentStream = stream;
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        tempCanvas.width = video.videoWidth;
                        tempCanvas.height = video.videoHeight;
                        detectCount = frameCount = 0;
                        startTime = Date.now();
                        startDetection();
                        statusEl.textContent = '📸 Camera đã sẵn sàng';
                        statusEl.className = 'status ready';
                        startBtn.style.display = 'none';
                        stopBtn.style.display = 'inline-block';
                    };
                } catch (err) {
                    console.error('Lỗi khi khởi động camera:', err);
                    statusEl.textContent =
                        '❌ Lỗi: Không thể khởi động camera.';
                    statusEl.className = 'status error';
                    stopBtn.style.display = 'none';
                    startBtn.style.display = 'inline-block';
                }
            }

            function stopCamera() {
                if (currentStream)
                    currentStream.getTracks().forEach((t) => t.stop());
                currentStream = null;
                stopDetection();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                startBtn.style.display = 'inline-block';
                stopBtn.style.display = 'none';
                statusEl.textContent = '🥒 Đã dừng camera';
                statusEl.className = 'status ready';
            }

            function startDetection() {
                interval = setInterval(() => {
                    if (!video.videoWidth) return;
                    tempCtx.drawImage(
                        video,
                        0,
                        0,
                        tempCanvas.width,
                        tempCanvas.height
                    );
                    tempCanvas.toBlob((blob) => {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            socket.emit('frame', {
                                image: reader.result,
                                dev_id: cameraSelect.value,
                                model_id: modelSelect.value, // Lấy model_id từ phần tử select
                            });
                            frameCount++;
                            updateStats();
                        };
                        reader.readAsDataURL(blob);
                    }, 'image/jpeg');
                }, 1000);
            }

            function stopDetection() {
                clearInterval(interval);
            }

            socket.on('detections', (data) => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                statusEl.textContent = data.detections?.length
                    ? '🔥 Phát hiện cháy!'
                    : '✅ Không phát hiện cháy.';

                if (data.detections && data.detections.length > 0) {
                    detectCount++; // Tăng số lần phát hiện
                    socket.emit('save_log', {
                        confidence: data.detections[0].confidence,
                        base64Image: tempCanvas.toDataURL('image/jpeg'),
                        dev_id: cameraSelect.value,
                        model_id: modelSelect.value, // Lấy model_id từ phần tử select khi lưu log
                    });
                    ctx.strokeStyle = 'red';
                    ctx.lineWidth = 3;
                    ctx.font = '18px Arial';
                    ctx.fillStyle = 'red';

                    data.detections.forEach((det) => {
                        const [x1, y1, x2, y2] = det.bbox;
                        const w = x2 - x1;
                        const h = y2 - y1;

                        ctx.strokeRect(x1, y1, w, h);
                        const confText =
                            (det.confidence * 100).toFixed(1) + '%';
                        ctx.fillText(confText, x1, y1 > 20 ? y1 - 5 : y1 + 20);
                    });
                }
                // ✅ Nếu backend gửi `fps`, thì dùng luôn nó
                if (data.fps !== undefined) {
                    fpsEl.textContent = data.fps.toFixed(1);
                }
            });

            socket.on('save_log_response', (data) => {
                if (data.status === 'success') {
                    console.log('Server đã lưu log:', data.message);
                } else if (data.status === 'info') {
                    console.log('Server đã bỏ qua lưu log:', data.message);
                } else {
                    console.error('Lỗi khi lưu log:', data.message);
                }
            });

            socket.on('error', (data) => {
                console.error('Server error:', data.message);
                statusEl.textContent = `❌ Lỗi từ server: ${data.message}`;
                statusEl.className = 'status error';
            });

            socket.on('status', (data) => {
                console.log('Server status:', data.message);
                if (data.model_health === false) {
                    statusEl.textContent = `⚠️ Model lỗi: ${data.health_details}`;
                    statusEl.className = 'status error';
                }
            });

            function updateStats() {
                const elapsed = (Date.now() - startTime) / 1000;
                // const fps = frameCount / elapsed;
                frameCountEl.textContent = frameCount;
                detectCountEl.textContent = detectCount;
                // fpsEl.textContent = fps.toFixed(1);
                uptimeEl.textContent = Math.floor(elapsed) + 's';
            }

            // Fullscreen handler (giữ nguyên)
            document.getElementById('fullscreen-btn').onclick = () => {
                const videoArea = document.querySelector('.video-area');
                if (
                    document.fullscreenElement === videoArea ||
                    document.webkitFullscreenElement === videoArea
                ) {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                } else {
                    if (videoArea.requestFullscreen) {
                        videoArea.requestFullscreen();
                    } else if (videoArea.webkitRequestFullscreen) {
                        videoArea.webkitRequestFullscreen();
                    }
                }
            };

            startBtn.onclick = () => {
                if (currentDbDeviceId === null) {
                    alert(
                        'Vui lòng đợi thiết bị được đăng ký với server trước khi bắt đầu.'
                    );
                    return;
                }
                if (!modelSelect.value) {
                    // Kiểm tra xem model đã được chọn chưa
                    alert('Vui lòng chọn một model trước khi bắt đầu.');
                    return;
                }
                startCamera(cameraSelect.value);
            };
            stopBtn.onclick = () => stopCamera();

            cameraSelect.onchange = async () => {
                const selectedDeviceId = cameraSelect.value;
                const selectedOption =
                    cameraSelect.options[cameraSelect.selectedIndex];
                const devName = selectedOption.text || `Camera`;

                try {
                    // Gửi thông tin thiết bị lên backend để cập nhật và lấy dev_id (số nguyên) mới
                    await saveDeviceToBackend(selectedDeviceId, devName);
                    // Sau khi cập nhật thành công, khởi động camera (hoặc để người dùng tự nhấn bắt đầu)
                    // startCamera(selectedDeviceId); // Bạn có thể bỏ dòng này nếu muốn người dùng nhấn "Bắt đầu" sau khi chọn camera
                } catch (error) {
                    console.error(
                        'Failed to update device and start camera:',
                        error
                    );
                    statusEl.textContent = `❌ Lỗi cập nhật thiết bị: ${error.message}`;
                    statusEl.className = 'status error';
                }
            };

            // Gọi listModels khi trang tải để điền danh sách model
            window.addEventListener('load', async () => {
                await listCameras();
                await listModels();
                $(modelSelect).select2({
                    placeholder: 'Chọn mô hình',
                    width: '100%',
                    templateResult: function (data) {
                        if (!data.id) return data.text;

                        const tag = $(data.element).data('tag');
                        const name = data.text;

                        if (tag) {
                            const colors = [
                                'primary',
                                'secondary',
                                'success',
                                'danger',
                                'warning',
                                'info',
                            ];
                            const tagHtml = tag
                                .split(',')
                                .map((t, i) => {
                                    const color = colors[i % colors.length];
                                    return `<span class="badge bg-${color} me-1 mb-1">${t.trim()}</span>`;
                                })
                                .join('');

                            return $(`
                <div>
                    <div><strong>${name}</strong></div>
                    <div class="mt-1">${tagHtml}</div>
                </div>
            `);
                        }

                        return `<span>${name}</span>`;
                    },
                    templateSelection: function (data) {
                        return data.text;
                    },
                });

                modelSelect.dispatchEvent(new Event('change')); // 👈 Gọi sự kiện thay đổi thủ công
            });
            const tooltipTriggerList = [].slice.call(
                document.querySelectorAll('[data-bs-toggle="tooltip"]')
            );
            tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });

            modelSelect.onchange = () => {
                const selectedOption =
                    modelSelect.options[modelSelect.selectedIndex];
                const tagText = selectedOption.dataset.tag || '';
                const tooltip = selectedOption.dataset.tooltip || '';

                const tagEl = document.getElementById('model-tag');
                const tooltipEl = document.getElementById('model-tooltip');
                const infoBox = document.getElementById('model-info');

                if (tagText || tooltip) {
                    // Clear cũ
                    tagEl.innerHTML = '';

                    // Tách tag bằng dấu phẩy
                    const tags = tagText.split(',').map((tag) => tag.trim());

                    const colors = [
                        'primary',
                        'success',
                        'warning',
                        'info',
                        'danger',
                        'secondary',
                    ];
                    tags.forEach((t, i) => {
                        const span = document.createElement('span');
                        span.className = `badge bg-${
                            colors[i % colors.length]
                        } text-white me-1`;
                        span.textContent = t;
                        tagEl.appendChild(span);
                    });

                    tooltipEl.textContent = tooltip;
                    infoBox.style.display = 'block';
                } else {
                    infoBox.style.display = 'none';
                }

                // Emit event nếu cần
                socket.emit('model_changed', {
                    model_id: modelSelect.value,
                    model_name: selectedOption.text,
                });
            };
        </script>
    </body>
</html>
