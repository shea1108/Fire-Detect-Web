<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realtime Fire Detection</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script> <!-- Socket.IO -->
  <style>
    #camera-select {
      margin-top: 10px;
      padding: 5px;
    }
    #camera-label {
      font-weight: bold;
      margin-top: 10px;
    }
    video {
      transform: scaleX(-1); /* Lật gương */
    }
    #status {
      margin-top: 10px;
      color: gray;
    }
    #start-camera-btn {
      margin-top: 15px;
      padding: 8px 15px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Hamburger -->
  <div id="hamburger" onclick="toggleSidebar()">☰</div>

  <!-- Overlay -->
  <div id="overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <h2>Thông tin người dùng</h2>
    <p><strong>Tên:</strong> Nguyễn Văn A</p>
    <p><strong>Email:</strong> user@example.com</p>
    <hr>
    <h3>Chức năng</h3>
    <ul class="sidebar-menu">
      <li onclick="location.href='/camera'">🔴 Detect with Camera</li>
      <li onclick="location.href='/picture'">🖼️ Detect with Picture</li>
      <li onclick="location.href='/video'">🎞️ Detect with Video</li>
    </ul>
    <button onclick="logout()">Đăng xuất</button>
  </div>

  <!-- Nội dung chính -->
  <div id="main-content">
    <button class="home-btn" onclick="location.href='/'"> 🏠 Về trang chủ </button>
    <h1 style="color: crimson;">Realtime Fire Detection Webcam</h1>

    <!-- VIDEO + CANVAS -->
    <div id="container">
      <video id="video" autoplay muted playsinline width="640" height="480"></video>
      <canvas id="canvas" width="640" height="480"></canvas>
      <canvas id="temp-canvas" style="display: none;" width="640" height="480"></canvas>
    </div>

    <!-- Camera chọn -->
    <div id="camera-options" style="margin-top: 20px;">
      <label id="camera-label" for="camera-select">Chọn thiết bị camera đầu vào:</label><br>
      <select id="camera-select"></select>
    </div>

    <!-- Nút bắt đầu camera -->
    <button id="start-camera-btn" style="display:none;">Bắt đầu camera</button>

    <!-- Trạng thái -->
    <p id="status">🕒 Vui lòng nhấn "Bắt đầu camera" để kích hoạt camera.</p>
  </div>

  <!-- JavaScript -->
  <script>
    const socket = io(); // WebSocket kết nối
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tempCanvas = document.getElementById('temp-canvas');
    const tempCtx = tempCanvas.getContext('2d');
    const cameraSelect = document.getElementById('camera-select');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start-camera-btn');
    let currentStream;

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const hamburger = document.getElementById('hamburger');

      const isActive = sidebar.classList.contains('active');
      if (isActive) {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
        hamburger.style.display = 'block';
      } else {
        sidebar.classList.add('active');
        overlay.classList.add('active');
        hamburger.style.display = 'none';
      }
    }

    function logout() {
      alert('Bạn đã đăng xuất!');
    }

    function isMobile() {
      return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function hasGetUserMedia() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    }

    async function listCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        cameraSelect.innerHTML = '';
        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Camera ${index + 1}`;
          cameraSelect.appendChild(option);
        });
      } catch (err) {
        console.error('Lỗi khi liệt kê camera:', err);
      }
    }

    async function startCamera(deviceId = null) {
      if (!hasGetUserMedia()) {
        alert("Trình duyệt của bạn không hỗ trợ camera.");
        statusEl.textContent = "❌ Trình duyệt không hỗ trợ camera.";
        return;
      }

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      let constraints;
      if (isMobile()) {
        constraints = {
          video: { facingMode: { ideal: "environment" } },
          audio: false
        };
      } else {
        constraints = deviceId
          ? { video: { deviceId: { exact: deviceId } }, audio: false }
          : { video: true, audio: false };
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        currentStream = stream;
        statusEl.textContent = "📸 Camera đã sẵn sàng.";
      } catch (err) {
        alert('Không thể mở camera: ' + err.message);
        console.error(err);
        statusEl.textContent = "❌ Lỗi khi mở camera.";
      }
    }

    function sendFrameWebSocket() {
      if (!video.videoWidth || !video.videoHeight) return;

      tempCanvas.width = video.videoWidth;
      tempCanvas.height = video.videoHeight;
      tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

      statusEl.textContent = "🕒 Đang phát hiện...";

      tempCanvas.toBlob(blob => {
        const reader = new FileReader();
        reader.onloadend = () => {
          socket.emit('frame', {
              image: reader.result,
              dev_id: 'test-device',
              model_id: 'test-model'
            })
        };
        reader.readAsDataURL(blob);
      }, 'image/jpeg');
    }

    socket.on('detections', data => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      statusEl.textContent = data.detections?.length ? "🔥 Phát hiện cháy!" : "✅ Không phát hiện cháy.";

      if (data.detections && data.detections.length > 0) {
          socket.emit('save_log', {
            confidence: data.detections[0].confidence,
            base64Image: tempCanvas.toDataURL('image/jpeg'),
            dev_id: 'test-device',
            model_id: 'test-model'
          });
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 3;
        ctx.font = '18px Arial';
        ctx.fillStyle = 'red';

        data.detections.forEach(det => {
          const [x1, y1, x2, y2] = det.bbox;
          const w = x2 - x1;
          const h = y2 - y1;

          ctx.save();
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1); // lật canvas
          ctx.strokeRect(canvas.width - x1 - w, y1, w, h);
          const confText = (det.confidence * 100).toFixed(1) + '%';
          ctx.fillText(confText, canvas.width - x1 - w, y1 > 20 ? y1 - 5 : y1 + 20);
          ctx.restore();
        });
      }
    });

    async function init() {
      if (!hasGetUserMedia()) {
        alert("Trình duyệt của bạn không hỗ trợ camera.");
        statusEl.textContent = "❌ Trình duyệt không hỗ trợ camera.";
        return;
      }

      if (isMobile()) {
        document.getElementById('camera-options').style.display = 'none';
        startBtn.style.display = 'inline-block';
        statusEl.textContent = "🕒 Vui lòng nhấn 'Bắt đầu camera' để kích hoạt camera.";
      } else {
        await listCameras();
        if (cameraSelect.options.length > 0) {
          await startCamera(cameraSelect.value);
          setInterval(() => {
            if (video.readyState === 4) {
              sendFrameWebSocket();
            }
          }, 500);
        }
      }
    }

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      statusEl.textContent = "📸 Đang mở camera...";
      await startCamera();
      setInterval(() => {
        if (video.readyState === 4) {
          sendFrameWebSocket();
        }
      }, 500);
    });

    cameraSelect.addEventListener('change', async () => {
      await startCamera(cameraSelect.value);
    });

    window.addEventListener('load', () => {
      init();
    });
  </script>
</body>
</html>
