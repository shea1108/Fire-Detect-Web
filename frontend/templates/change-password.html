<!-- @format -->

<!DOCTYPE html>
<html lang="zxx">
    <head>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
        {% include ('partials/head.html') %}
        <script
            src="https://www.google.com/recaptcha/api.js"
            async
            defer
        ></script>

        <style>
            .btn-disabled {
                pointer-events: none;
                opacity: 0.5;
                cursor: not-allowed;
            }

            .toggle-password {
                position: absolute;
                top: 50%;
                right: 40px;
                transform: translateY(-50%);
                cursor: pointer;
                font-size: 18px;
                color: #666;
                user-select: none;
                z-index: 2;
                opacity: 0.4; /* Mờ mặc định */
                transition: opacity 0.2s ease-in-out; /* Mượt mà khi hover */
            }
            .toggle-password:hover {
                opacity: 1; /* Rõ nét khi hover */
            }
        </style>
    </head>
    <body>
        <!-- Start Navbar Sidebar Area -->
        {% include ('partials/narvar_sidebar.html') %}
        <!-- End Navbar Sidebar Modal -->

        <!-- Start Sign Up Area -->
        <section class="sing-up-area ptb-100">
            <div class="container">
                <div class="section-title text-center">
                    <h2>Đổi mật khẩu</h2>
                </div>
                <div class="contact-wrap-form log-in-width">
                    <form method="post" id="change-password-form">
                        <div class="row justify-content-center">
                            <div class="col-12">
                                <div
                                    class="form-floating position-relative mb-3"
                                >
                                    <input
                                        class="form-control"
                                        type="password"
                                        name="old_password"
                                        id="old-password"
                                        placeholder="Mật khẩu cũ"
                                        required
                                        minlength="6"
                                    />
                                    <label for="old-password"
                                        >Mật khẩu cũ</label
                                    >
                                    <i
                                        class="fa fa-lock toggle-password"
                                        toggle="#old-password"
                                        title="Hiện/ẩn mật khẩu"
                                    ></i>
                                </div>
                            </div>
                            <div class="col-12">
                                <div
                                    class="form-floating position-relative mb-3"
                                >
                                    <input
                                        class="form-control"
                                        type="password"
                                        name="new_password"
                                        id="new-password"
                                        placeholder="Mật khẩu mới"
                                        required
                                        minlength="6"
                                    />
                                    <label for="new-password"
                                        >Mật khẩu mới</label
                                    >

                                    <i
                                        class="fa fa-lock toggle-password"
                                        toggle="#new-password"
                                        title="Hiện/ẩn mật khẩu"
                                    ></i>
                                </div>
                            </div>
                            <div class="col-12">
                                <div
                                    class="form-floating position-relative mb-3"
                                >
                                    <input
                                        class="form-control"
                                        type="password"
                                        name="confirm_password"
                                        id="confirm-password"
                                        placeholder="Xác nhận mật khẩu mới"
                                        required
                                        minlength="6"
                                    />
                                    <label for="confirm-password"
                                        >Xác nhận mật khẩu mới</label
                                    >
                                    <i
                                        class="fa fa-lock toggle-password"
                                        toggle="#confirm-password"
                                        title="Hiện/ẩn mật khẩu"
                                    ></i>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-text text-muted ms-1 ps-2">
                                    Mật khẩu mới phải có ít nhất 8 ký tự, bao
                                    gồm chữ in hoa, chữ thường, số và ký tự đặc
                                    biệt.
                                </div>
                            </div>
                            
                            <div class="col-12 text-center mb-3">
                                <div
                                    class="g-recaptcha d-inline-block"
                                    data-sitekey="{{ recaptcha_site_key }}"
                                    data-callback="onCaptchaVerified"
                                    data-expired-callback="onCaptchaExpired"
                                ></div>
                            </div>

                            <div class="col-12 text-center mb-3">
                                <button
                                    class="default-btn btn-two btn-disabled"
                                    type="submit"
                                >
                                    Xác nhận
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- End Sign Up Area -->

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const oldPass = document.getElementById('old-password');
                const newPass = document.getElementById('new-password');
                const confirmPass = document.getElementById('confirm-password');
                const submitBtn = document.querySelector(
                    'button[type="submit"]'
                );
                const form = document.getElementById('change-password-form');

                function showToast(message, icon) {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: icon,
                        title: message,
                        showConfirmButton: false,
                        timer: 2500,
                        timerProgressBar: true,
                    });
                }

                function validateForm(showToastIfInvalid = false) {
                    const op = oldPass.value.trim();
                    const np = newPass.value.trim();
                    const cp = confirmPass.value.trim();

                    // Reset trạng thái
                    [newPass, confirmPass].forEach((el) =>
                        el.classList.remove('is-valid', 'is-invalid')
                    );

                    // Chưa đủ 3 trường thì không kiểm tra gì cả
                    if (!op || !np || !cp) {
                        submitBtn.classList.add('btn-disabled');
                        return;
                    }

                    let valid = true;

                    const passwordPattern =
                        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

                    if (!passwordPattern.test(np)) {
                        valid = false;
                        newPass.classList.add('is-invalid');
                        if (showToastIfInvalid)
                            showToast(
                                '🔒 Mật khẩu phải có ít nhất 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.',
                                'warning'
                            );
                    }

                    if (cp !== np) {
                        valid = false;
                        confirmPass.classList.add('is-invalid');
                        if (showToastIfInvalid)
                            showToast(
                                '❌ Mật khẩu xác nhận không khớp.',
                                'error'
                            );
                    }

                    if (valid) {
                        [newPass, confirmPass].forEach((el) =>
                            el.classList.add('is-valid')
                        );
                        submitBtn.classList.remove('btn-disabled');
                    } else {
                        submitBtn.classList.add('btn-disabled');
                    }
                }

                [oldPass, newPass, confirmPass].forEach((el) => {
                    el.addEventListener('input', () => validateForm(false));
                    el.addEventListener('blur', () => validateForm(true));
                });
                form.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    if (submitBtn.classList.contains('btn-disabled')) return;

                    const old_password = oldPass.value.trim();
                    const new_password = newPass.value.trim();

                    // 👉 Hiện loading ngay lập tức
                    Swal.fire({
                        title: 'Đang xử lý...',
                        text: 'Vui lòng chờ trong giây lát',
                        allowOutsideClick: false,
                        didOpen: () => {
                            Swal.showLoading();
                        },
                    });

                    try {
                        const recaptchaToken = grecaptcha.getResponse();
                        if (!recaptchaToken) {
                            Swal.fire({
                                icon: 'warning',
                                title: '⚠️ Vui lòng xác thực reCAPTCHA',
                                text: 'Bạn chưa xác minh reCAPTCHA.',
                                showCloseButton: true, // 👈 Thêm dòng này
                            });
                            return;
                        }
                        const res = await fetch(
                            '/api/user/request-password-change',

                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    old_password,
                                    new_password,
                                    'g-recaptcha-response': recaptchaToken,
                                }),
                            }
                        );

                        const result = await res.json();

                        if (result.success && result.redirect) {
                            Swal.fire({
                                icon: 'success',
                                title: '✅ Thành công!',
                                text: 'Đã gửi mã xác nhận OTP đến email.',
                                showConfirmButton: false,
                                timer: 1500,
                            });

                            setTimeout(() => {
                                window.location.href = result.redirect;
                            }, 1600);
                            grecaptcha.reset();
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Lỗi',
                                text:
                                    result.message || 'Đổi mật khẩu thất bại.',
                            });
                            grecaptcha.reset();
                        }
                    } catch (err) {
                        Swal.fire({
                            icon: 'error',
                            title: '⚠️ Lỗi kết nối',
                            text: err.message,
                        });
                        grecaptcha.reset();
                    }
                });

                // Toggle hiển thị mật khẩu
                document
                    .querySelectorAll('.toggle-password')
                    .forEach((icon) => {
                        icon.addEventListener('click', function () {
                            const input = document.querySelector(
                                this.getAttribute('toggle')
                            );
                            const isShown = input.type === 'text';
                            input.type = isShown ? 'password' : 'text';
                            this.classList.toggle('fa-lock', isShown);
                            this.classList.toggle('fa-unlock', !isShown);
                        });
                    });
            });
        </script>

        <!-- Footer Area -->
        {% include ('partials/footer.html') %}

        <!-- JS Libraries -->
        <script src="/static/assets/js/jquery.min.js"></script>
        <script src="/static/assets/js/bootstrap.bundle.min.js"></script>
        <script src="/static/assets/js/meanmenu.min.js"></script>
        <script src="/static/assets/js/owl.carousel.min.js"></script>
        <script src="/static/assets/js/jquery.magnific-popup.min.js"></script>
        <script src="/static/assets/js/wow.min.js"></script>
        <script src="/static/assets/js/jquery.ajaxchimp.min.js"></script>
        <script src="/static/assets/js/form-validator.min.js"></script>
        <script src="/static/assets/js/contact-form-script.js"></script>
        <script src="/static/assets/js/custom.js"></script>
    </body>
</html>
