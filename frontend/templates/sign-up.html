<!-- @format -->

<!DOCTYPE html>
<html lang="vi">
    <head>
        {% include ('partials/head.html')%}
        <script
            src="https://www.google.com/recaptcha/api.js"
            async
            defer
        ></script>

        <style>
            .is-valid {
                border-color: #28a745 !important;
            }
            .is-invalid {
                border-color: #dc3545 !important;
            }
            .btn-disabled {
                opacity: 0.5;
                cursor: not-allowed;
                pointer-events: none;
            }
        </style>
        <style>
            .form-floating > label {
                padding-left: 0.75rem;
            }
        </style>
    </head>
    <body>
        <!-- Navbar -->
        {% include ('partials/narvar_sidebar.html') %}

        <!-- Sign Up Area -->
        <section class="sign-up-area ptb-100">
            <div class="container">
                <div class="section-title text-center">
                    <span>Đăng Ký</span>
                    <h2>Tạo Tài Khoản Mới!</h2>
                </div>
                <div class="contact-wrap-form log-in-width">
                    <form id="register-form" method="post" novalidate>
                        <div class="row justify-content-center">
                            <!-- Form Inputs -->
                            <!-- Họ và tên -->
                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="floatingName"
                                        name="user_name"
                                        placeholder="Họ và tên"
                                        required
                                    />
                                    <label for="floatingName">Họ và tên</label>
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input
                                        type="email"
                                        class="form-control"
                                        id="floatingEmail"
                                        name="user_email"
                                        placeholder="Email"
                                        required
                                    />
                                    <label for="floatingEmail"
                                        >Email (@gmail.com)</label
                                    >
                                </div>
                            </div>

                            <!-- Số điện thoại -->
                            <!-- Số điện thoại -->
                            <!-- Số điện thoại -->
                            <div class="col-12">
                                <label
                                    class="form-label ms-1 mb-1"
                                    for="floatingPhone"
                                    >Số điện thoại</label
                                >
                                <div class="input-group mb-3">
                                    <span
                                        class="input-group-text"
                                        id="vietnam-prefix"
                                        >🇻🇳 +84</span
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="floatingPhone"
                                        name="user_phone_num"
                                        placeholder="Ví dụ: 0912345678"
                                        maxlength="9"
                                        pattern="\d{9}"
                                        inputmode="numeric"
                                        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                        aria-describedby="vietnam-prefix"
                                        required
                                    />
                                </div>
                            </div>

                            <!-- Mật khẩu -->
                            <div class="col-12">
                                <div
                                    class="form-floating mb-3 position-relative"
                                >
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="register_password"
                                        name="user_password"
                                        placeholder="Mật khẩu"
                                        required
                                    />
                                    <label for="register_password"
                                        >Mật khẩu</label
                                    >
                                    <i
                                        class="bx bx-show toggle-password"
                                        id="toggleRegisterPassword"
                                        style="
                                            position: absolute;
                                            top: 50%;
                                            right: 30px;
                                            transform: translateY(-50%);
                                            cursor: pointer;
                                        "
                                    ></i>
                                </div>
                                <div
                                    id="password-help"
                                    class="form-text text-muted ms-2 mt-n2"
                                    style="font-size: 0.9rem"
                                >
                                    Mật khẩu phải có ít nhất 8 ký tự, gồm chữ
                                    hoa, chữ thường, số và ký tự đặc biệt.
                                </div>
                            </div>

                            <!-- reCAPTCHA Widget -->
                            <div class="col-12 margin-top-10">
                                <div
                                    class="form-group d-flex justify-content-center"
                                >
                                    <div
                                        class="g-recaptcha"
                                        data-sitekey="{{ recaptcha_site_key }}"
                                        data-callback="onCaptchaVerified"
                                        data-expired-callback="onCaptchaExpired"
                                    ></div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="col-12 text-center">
                                <!-- Nút này không còn bị vô hiệu hóa bởi JavaScript -->
                                <button
                                    class="default-btn btn-two"
                                    type="submit"
                                >
                                    Đăng ký
                                </button>
                            </div>
                            <div class="col-12">
                                <p class="account-desc">
                                    Đã có tài khoản?
                                    <a href="{{ url_for('web.sign_in') }}"
                                        >Đăng nhập tại đây</a
                                    >
                                </p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- SCRIPT SECTION -->
        <script>
            function onCaptchaVerified() {
                document.dispatchEvent(
                    new CustomEvent('captchaStateChange', {
                        detail: { verified: true },
                    })
                );
            }
            function onCaptchaExpired() {
                document.dispatchEvent(
                    new CustomEvent('captchaStateChange', {
                        detail: { verified: false },
                    })
                );
            }

            // === LOGIC CHÍNH CỦA FORM ===
            document.addEventListener('DOMContentLoaded', function () {
                // --- Lấy các phần tử DOM ---
                const form = document.getElementById('register-form');
                const emailInput = form.querySelector(
                    'input[name="user_email"]'
                );
                const phoneInput = form.querySelector(
                    'input[name="user_phone_num"]'
                );
                const submitBtn = form.querySelector('button[type="submit"]');

                // --- Biến trạng thái ---
                let state = {
                    isEmailOk: false,
                    isPhoneOk: false,
                    isCaptchaOk: false,
                    emailDebounce: null,
                    phoneDebounce: null,
                };

                // --- Lắng nghe sự kiện từ reCAPTCHA ---
                document.addEventListener('captchaStateChange', (e) => {
                    state.isCaptchaOk = e.detail.verified;
                    // Không cần gọi toggleSubmitButton ở đây nữa
                });

                // --- Hàm cập nhật giao diện cho input (viền xanh/đỏ) ---
                const updateInputFeedback = (input, isValid, message = '') => {
                    input.classList.remove('is-valid', 'is-invalid');
                    input.title = '';
                    if (isValid === true) input.classList.add('is-valid');
                    else if (isValid === false) {
                        input.classList.add('is-invalid');
                        input.title = message;
                    }
                };

                // === CÁC HÀM VALIDATION ===

                const validateEmail = async () => {
                    const email = emailInput.value.trim();
                    if (!email) {
                        state.isEmailOk = false;
                        updateInputFeedback(emailInput, null);
                        return;
                    }

                    const emailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/i;
                    if (!emailPattern.test(email)) {
                        state.isEmailOk = false;
                        updateInputFeedback(
                            emailInput,
                            false,
                            'Chỉ chấp nhận email @gmail.com'
                        );
                        return;
                    }

                    try {
                        const res = await fetch(
                            '/api/user/check-email-exists',
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ email }),
                            }
                        );
                        const result = await res.json();
                        state.isEmailOk = !result.exists;
                        updateInputFeedback(
                            emailInput,
                            state.isEmailOk,
                            'Email này đã được sử dụng'
                        );
                    } catch (err) {
                        console.error('Lỗi kiểm tra email:', err);
                        state.isEmailOk = false;
                    }
                };

                const validatePhone = async () => {
                    const phone = phoneInput.value.trim();
                    if (!phone) {
                        state.isPhoneOk = false;
                        updateInputFeedback(phoneInput, null);
                        return;
                    }

                    const vietnamesePhonePattern =
                        /^0(9[0-9]|8[1-9]|7[0|6|7|8|9]|5[2|6|8|9]|3[2-9])\d{7}$/;
                    if (!vietnamesePhonePattern.test(phone)) {
                        state.isPhoneOk = false;
                        updateInputFeedback(
                            phoneInput,
                            false,
                            'Số điện thoại không đúng định dạng của Việt Nam.'
                        );
                        return;
                    }

                    try {
                        const res = await fetch(
                            '/api/user/check-phone-exists',
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ phone }),
                            }
                        );
                        const result = await res.json();
                        state.isPhoneOk = !result.exists;
                        updateInputFeedback(
                            phoneInput,
                            state.isPhoneOk,
                            'Số điện thoại này đã được sử dụng'
                        );
                    } catch (err) {
                        console.error('Lỗi kiểm tra số điện thoại:', err);
                        state.isPhoneOk = false;
                    }
                };
                const passwordInput = form.querySelector('#register_password');

                const validatePassword = () => {
                    const password = passwordInput.value;
                    const pattern =
                        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

                    if (!password) {
                        updateInputFeedback(passwordInput, null);
                        return false;
                    }

                    const isValid = pattern.test(password);
                    updateInputFeedback(
                        passwordInput,
                        isValid,
                        'Mật khẩu phải có ít nhất 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.'
                    );
                    return isValid;
                };

                // === GẮN EVENT LISTENERS ===

                emailInput.addEventListener('input', () => {
                    clearTimeout(state.emailDebounce);
                    updateInputFeedback(emailInput, null);
                    state.emailDebounce = setTimeout(validateEmail, 500);
                });
                emailInput.addEventListener('change', validateEmail);

                phoneInput.addEventListener('input', () => {
                    clearTimeout(state.phoneDebounce);
                    updateInputFeedback(phoneInput, null);
                    state.phoneDebounce = setTimeout(validatePhone, 500);
                });
                phoneInput.addEventListener('change', validatePhone);

                passwordInput.addEventListener('input', validatePassword);
                passwordInput.addEventListener('change', validatePassword);

                // === CHẠY KIỂM TRA MỘT LẦN KHI TẢI TRANG ĐỂ BẮT AUTOFILL ===
                setTimeout(() => {
                    validateEmail();
                    validatePhone();
                }, 100);

                // --- Xử lý khi GỬI FORM ---
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const isPasswordOk = validatePassword();

                    // === THAY ĐỔI CHÍNH: KIỂM TRA VALIDATION KHI SUBMIT ===
                    const { isEmailOk, isPhoneOk, isCaptchaOk } = state;
                    if (
                        !isEmailOk ||
                        !isPhoneOk ||
                        !isCaptchaOk ||
                        !isPasswordOk
                    ) {
                        let errorMessages = [];
                        if (!isEmailOk)
                            errorMessages.push(
                                'Email không hợp lệ hoặc đã được sử dụng.'
                            );
                        if (!isPhoneOk)
                            errorMessages.push(
                                'Số điện thoại không hợp lệ hoặc đã được sử dụng.'
                            );
                        if (!isCaptchaOk)
                            errorMessages.push(
                                'Vui lòng xác thực bạn không phải là robot.'
                            );
                        if (!isPasswordOk)
                            errorMessages.push(
                                'Mật khẩu chưa đáp ứng yêu cầu bảo mật.'
                            );

                        Swal.fire({
                            icon: 'error',
                            title: 'Thông tin chưa hợp lệ',
                            html: errorMessages.join('<br>'), // Hiển thị lỗi rõ ràng hơn
                        });
                        return; // Dừng lại, không gửi form
                    }

                    // Nếu tất cả đều hợp lệ, tiếp tục logic gửi form
                    const formData = new FormData(form);
                    const jsonData = Object.fromEntries(formData.entries());

                    Swal.fire({
                        title: 'Đang xử lý...',
                        text: 'Vui lòng chờ...',
                        allowOutsideClick: false,
                        didOpen: () => Swal.showLoading(),
                    });

                    try {
                        const res = await fetch('/api/auth/register/send-otp', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(jsonData),
                        });
                        const data = await res.json();
                        Swal.close();
                        if (res.ok) {
                            await Swal.fire({
                                icon: 'success',
                                title: 'Gửi mã thành công!',
                                text: 'Mã OTP đã được gửi. Chúng tôi sẽ chuyển bạn đến trang xác thực.',
                                timer: 2500,
                                timerProgressBar: true,
                                showConfirmButton: false,
                            });
                            window.location.href = `/register/verify-otp?email=${encodeURIComponent(
                                data.email
                            )}`;
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Đăng ký thất bại',
                                text:
                                    data.error ||
                                    'Có lỗi xảy ra, vui lòng thử lại.',
                            });
                            if (typeof grecaptcha !== 'undefined') {
                                grecaptcha.reset();
                                state.isCaptchaOk = false;
                            }
                        }
                    } catch (err) {
                        Swal.close();
                        Swal.fire({
                            icon: 'error',
                            title: 'Lỗi kết nối',
                            text: 'Không thể kết nối đến máy chủ.',
                        });
                    }
                });
            });
        </script>

        <script>
            // 👁 Toggle mật khẩu đăng ký
            document
                .getElementById('toggleRegisterPassword')
                .addEventListener('click', function () {
                    const input = document.getElementById('register_password');
                    const isHidden = input.type === 'password';
                    input.type = isHidden ? 'text' : 'password';
                    this.classList.toggle('bx-show', !isHidden);
                    this.classList.toggle('bx-hide', isHidden);
                });
        </script>
        <!-- Footer và các script khác của template -->
        {% include ('partials/footer.html') %}
        <script src="/static/assets/js/jquery.min.js"></script>
        <script src="/static/assets/js/bootstrap.bundle.min.js"></script>
        <script src="/static/assets/js/meanmenu.min.js"></script>
        <script src="/static/assets/js/owl.carousel.min.js"></script>
        <script src="/static/assets/js/jquery.magnific-popup.min.js"></script>
        <script src="/static/assets/js/wow.min.js"></script>
        <script src="/static/assets/js/jquery.ajaxchimp.min.js"></script>
        <script src="/static/assets/js/form-validator.min.js"></script>
        <script src="/static/assets/js/contact-form-script.js"></script>
        <script src="/static/assets/js/custom.js"></script>
    </body>
</html>
