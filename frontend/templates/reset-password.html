<!-- @format -->

<!DOCTYPE html>
<html lang="zxx">
    <head>
        {% include ('partials/head.html')%}
        <!-- Thêm SweetAlert2 CDN -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>
    <body>
        <!-- Start Navbar Sidebar Area -->
        {% include ('partials/narvar_sidebar.html') %}
        <!-- End Navbar Sidebar Modal -->

        <!-- Start Reset Password Area -->
        <section class="sing-up-area ptb-100">
            <div class="container">
                <div class="section-title text-center">
                    <h2>Tạo mật khẩu mới</h2>
                    <p>Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>
                </div>
                <div class="contact-wrap-form log-in-width">
                    <form id="reset-password-form">
                        <!-- Trường ẩn để lưu token, sẽ được điền bằng JS -->
                        <input type="hidden" id="reset-token" />

                        <div class="row justify-content-center">
                            <div class="col-12">
                                <div class="form-group">
                                    <input
                                        id="new-password"
                                        class="form-control"
                                        type="password"
                                        placeholder="Nhập mật khẩu mới"
                                        required
                                    />
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-group">
                                    <input
                                        id="confirm-password"
                                        class="form-control"
                                        type="password"
                                        placeholder="Xác nhận mật khẩu mới"
                                        required
                                    />
                                </div>
                            </div>
                            <div class="col-12 text-center">
                                <button
                                    class="default-btn btn-two"
                                    type="submit"
                                >
                                    Lưu mật khẩu
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        <!-- End Reset Password Area -->
        
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const form = document.getElementById('reset-password-form');
                const tokenInput = document.getElementById('reset-token');

                // SỬA LỖI: Lấy token từ query parameter của URL
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');

                if (token) {
                    tokenInput.value = token;
                } else {
                    // Nếu không có token, vô hiệu hóa form và báo lỗi
                    form.innerHTML = '<p class="text-center text-danger">Token đặt lại mật khẩu không hợp lệ hoặc đã bị thiếu.</p>';
                    return;
                }

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const password = document.getElementById('new-password').value;
                    const confirmPassword = document.getElementById('confirm-password').value;

                    if (password !== confirmPassword) {
                        Swal.fire({ icon: 'error', title: 'Lỗi', text: 'Mật khẩu xác nhận không khớp!' });
                        return;
                    }
                    if (password.length < 6) {
                        Swal.fire({ icon: 'error', title: 'Lỗi', text: 'Mật khẩu phải có ít nhất 6 ký tự.' });
                        return;
                    }

                    try {
                        const res = await fetch('/api/auth/reset-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: tokenInput.value, password: password }),
                        });
                        const data = await res.json();
                        if (res.ok) {
                            await Swal.fire({
                                icon: 'success',
                                title: 'Thành công!',
                                text: 'Mật khẩu của bạn đã được cập nhật. Đang chuyển đến trang đăng nhập...',
                                timer: 3000,
                                showConfirmButton: false
                            });
                            window.location.href = '/sign-in.html'; // Chuyển hướng
                        } else {
                            Swal.fire({ icon: 'error', title: 'Thất bại', text: data.error || 'Token không hợp lệ hoặc đã hết hạn.' });
                        }
                    } catch (err) {
                        Swal.fire({ icon: 'error', title: 'Lỗi kết nối', text: 'Không thể kết nối đến máy chủ.' });
                    }
                });
            });
        </script>

        <!-- Footer và các script khác -->
        {% include ('partials/footer.html') %}
        <script src="/static/assets/js/jquery.min.js"></script>
        <script src="/static/assets/js/bootstrap.bundle.min.js"></script>
        <!-- Các script khác... -->
    </body>
</html>
