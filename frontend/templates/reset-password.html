<!-- @format -->

<!DOCTYPE html>
<html lang="zxx">
    <head>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
        {% include ('partials/head.html') %}

        <style>
            .btn-disabled {
                pointer-events: none;
                opacity: 0.5;
                cursor: not-allowed;
            }

            .toggle-password {
                position: absolute;
                top: 50%;
                right: 40px;
                transform: translateY(-50%);
                cursor: pointer;
                font-size: 18px;
                color: #666;
                user-select: none;
                z-index: 2;
                opacity: 0.4; /* Mờ mặc định */
                transition: opacity 0.2s ease-in-out; /* Mượt mà khi hover */
            }
            .toggle-password:hover {
                opacity: 1; /* Rõ nét khi hover */
            }
        </style>
    </head>
    <body>
        <!-- Start Navbar Sidebar Area -->
        {% include ('partials/narvar_sidebar.html') %}
        <!-- End Navbar Sidebar Modal -->

        <!-- Start Sign Up Area -->
        <section class="sing-up-area ptb-100">
            <div class="container">
                <div class="section-title text-center">
                    <h2>Đặt mật khẩu mới</h2>
                </div>
                <div class="contact-wrap-form log-in-width">
                    <form method="post" id="reset-form">
                        <div class="row justify-content-center">
                            <div class="col-12">
                                <div class="form-group position-relative">
                                    <input
                                        class="form-control"
                                        type="password"
                                        name="new_password"
                                        id="new-password"
                                        placeholder="Mật khẩu mới"
                                        required
                                        minlength="6"
                                    />
                                    <i
                                        class="fa fa-lock toggle-password"
                                        toggle="#new-password"
                                        title="Hiện/ẩn mật khẩu"
                                    ></i>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-group position-relative">
                                    <input
                                        class="form-control"
                                        type="password"
                                        name="confirm_password"
                                        id="confirm-password"
                                        placeholder="Nhập lại mật khẩu mới"
                                        required
                                        minlength="6"
                                    />
                                    <i
                                        class="fa fa-lock toggle-password"
                                        toggle="#confirm-password"
                                        title="Hiện/ẩn mật khẩu"
                                    ></i>
                                </div>
                            </div>

                            <div class="col-12 text-center">
                                <button
                                    class="default-btn btn-two btn-disabled"
                                    type="submit"
                                >
                                    Xác nhận
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        <!-- End Sign Up Area -->

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const newPass = document.getElementById('new-password');
                const confirmPass = document.getElementById('confirm-password');
                const submitBtn = document.querySelector(
                    'button[type="submit"]'
                );
                const form = document.getElementById('reset-form');

                submitBtn.classList.add('btn-disabled');

                function showToast(message, icon) {
                    Swal.fire({
                        toast: true,
                        position: 'top-end',
                        icon: icon,
                        title: message,
                        showConfirmButton: false,
                        timer: 2500,
                        timerProgressBar: true,
                    });
                }

                function validatePasswords(showToastIfInvalid = false) {
                    const np = newPass.value.trim();
                    const cp = confirmPass.value.trim();
                    let valid = true;

                    newPass.classList.remove('is-valid', 'is-invalid');
                    confirmPass.classList.remove('is-valid', 'is-invalid');

                    if (np.length < 6) {
                        newPass.classList.add('is-invalid');
                        valid = false;
                        if (showToastIfInvalid) {
                            showToast(
                                '❗ Mật khẩu phải có ít nhất 6 ký tự!',
                                'warning'
                            );
                        }
                    }

                    if (cp.length < 6) {
                        confirmPass.classList.add('is-invalid');
                        valid = false;
                        if (showToastIfInvalid) {
                            showToast(
                                '❗ Nhập lại mật khẩu phải có ít nhất 6 ký tự!',
                                'warning'
                            );
                        }
                    }

                    if (np.length >= 6 && cp.length >= 6 && np !== cp) {
                        confirmPass.classList.add('is-invalid');
                        valid = false;
                        if (showToastIfInvalid) {
                            showToast('❌ Mật khẩu không trùng khớp.', 'error');
                        }
                    }

                    if (valid && np === cp) {
                        newPass.classList.add('is-valid');
                        confirmPass.classList.add('is-valid');
                        submitBtn.classList.remove('btn-disabled');
                    } else {
                        submitBtn.classList.add('btn-disabled');
                    }
                }

                newPass.addEventListener('input', () =>
                    validatePasswords(false)
                );
                confirmPass.addEventListener('input', () =>
                    validatePasswords(false)
                );
                newPass.addEventListener('blur', () => validatePasswords(true));
                confirmPass.addEventListener('blur', () =>
                    validatePasswords(true)
                );

                form.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    if (submitBtn.classList.contains('btn-disabled')) return;

                    const password = newPass.value.trim();

                    // Lấy token từ URL
                    const token = window.location.pathname.split('/').pop();

                    try {
                        const res = await fetch(
                            `/api/user/reset-password/${token}`,
                            {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({
                                    new_password: password,
                                }),
                            }
                        );

                        const result = await res.json();

                        if (result.success) {
                            showToast(
                                '✅ Đặt lại mật khẩu thành công!',
                                'success'
                            );
                            submitBtn.classList.add('btn-disabled');
                            submitBtn.innerText = 'Thành công';
                            setTimeout(() => {
                                window.location.href = '/sign-in.html';
                            }, 1500);
                        } else {
                            showToast(
                                result.message || '❌ Có lỗi xảy ra!',
                                'error'
                            );
                            submitBtn.classList.remove('btn-disabled');
                            submitBtn.innerText = 'Xác nhận';
                        }
                    } catch (err) {
                        showToast(
                            '⚠️ Lỗi gửi yêu cầu: ' + err.message,
                            'error'
                        );
                        submitBtn.classList.remove('btn-disabled');
                        submitBtn.innerText = 'Xác nhận';
                    }
                });

                // Toggle hiển thị mật khẩu
                document
                    .querySelectorAll('.toggle-password')
                    .forEach((icon) => {
                        icon.addEventListener('click', function () {
                            const input = document.querySelector(
                                this.getAttribute('toggle')
                            );
                            const isShown = input.type === 'text';
                            input.type = isShown ? 'password' : 'text';
                            this.classList.remove('fa-lock', 'fa-unlock');
                            this.classList.add(
                                isShown ? 'fa-lock' : 'fa-unlock'
                            );
                        });
                    });
            });
        </script>

        <!-- Footer Area -->
        {% include ('partials/footer.html') %}

        <!-- JS Libraries -->
        <script src="/static/assets/js/jquery.min.js"></script>
        <script src="/static/assets/js/bootstrap.bundle.min.js"></script>
        <script src="/static/assets/js/meanmenu.min.js"></script>
        <script src="/static/assets/js/owl.carousel.min.js"></script>
        <script src="/static/assets/js/jquery.magnific-popup.min.js"></script>
        <script src="/static/assets/js/wow.min.js"></script>
        <script src="/static/assets/js/jquery.ajaxchimp.min.js"></script>
        <script src="/static/assets/js/form-validator.min.js"></script>
        <script src="/static/assets/js/contact-form-script.js"></script>
        <script src="/static/assets/js/custom.js"></script>
    </body>
</html>
