<!-- @format -->

<!DOCTYPE html>
<html lang="zxx">
    <head>
        {% include ('partials/head.html')%}
    </head>
    <body>
        <!-- Start Navbar Sidebar Area -->
        {% include ('partials/narvar_sidebar.html') %}
        <!-- End Navbar Sidebar Modal -->
        <!-- Inner Banner End -->

        <!-- Start Sign In Area -->
        <section class="sign-in-area ptb-100">
            <div class="container">
                <div class="section-title text-center">
                    <h2>Đăng nhập vào tài khoản của bạn!</h2>
                </div>
                <div class="contact-wrap-form log-in-width">
                    <form id="login-form" method="post">
                        <!-- <p>Đăng nhập bằng mạng xã hội</p> -->
                        <div class="row justify-content-center">
                            <!-- <div class="col-lg-4 col-md-4 col-sm-4">
                                <button
                                    class="login-social-btn"
                                    type="button"
                                    onclick="window.location.href='/api/auth/google/login'"
                                >
                                    <i class="bx bxl-google-plus"></i>
                                </button>
                            </div>

                            <div class="col-lg-4 col-md-4 col-sm-4">
                                <button class="login-social-btn" type="button">
                                    <i class="bx bxl-facebook"></i>
                                </button>
                            </div>

                            <div class="col-lg-4 col-md-4 col-sm-4">
                                <button class="login-social-btn" type="button">
                                    <i class="bx bxl-twitter"></i>
                                </button>
                            </div> -->

                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input
                                        type="email"
                                        class="form-control"
                                        id="floatingEmail"
                                        name="user_email"
                                        placeholder="Email"
                                        required
                                    />
                                    <label for="floatingEmail">Email</label>
                                </div>
                            </div>

                            <div class="col-12">
                                <div
                                    class="form-floating position-relative mb-3"
                                >
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="user_password"
                                        name="user_password"
                                        placeholder="Mật khẩu"
                                        required
                                    />
                                    <label for="user_password">Mật khẩu</label>
                                    <i
                                        class="bx bx-show toggle-password"
                                        id="togglePassword"
                                        style="
                                            position: absolute;
                                            top: 50%;
                                            right: 15px;
                                            transform: translateY(-50%);
                                            cursor: pointer;
                                            z-index: 2;
                                        "
                                    ></i>
                                </div>
                            </div>

                            <div class="col-lg-6 col-sm-6 form-condition">
                                <div class="agree-label">
                                    <input type="checkbox" id="chb1" />
                                    <label for="chb1">
                                        Ghi nhớ đăng nhập
                                    </label>
                                </div>
                            </div>

                            <div class="col-lg-6 col-sm-6">
                                <a class="forget" href="recover-password.html"
                                    >Quên mật khẩu?</a
                                >
                            </div>

                            <div class="col-12 text-center">
                                <button
                                    class="default-btn btn-two"
                                    type="submit"
                                >
                                    Đăng Nhập
                                </button>
                            </div>

                            <div class="col-12">
                                <p class="account-desc">
                                    Chưa có tài khoản?
                                    <a href="/sign-up">Đăng ký tại đây</a>
                                </p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        <!-- End Sign In Area -->

        <script>
            // Kiểm tra nếu đã đăng nhập rồi thì chuyển hướng luôn
            document.addEventListener('DOMContentLoaded', async () => {
                try {
                    const res = await fetch('/api/auth/me', {
                        method: 'GET',
                        credentials: 'include',
                        headers: { Accept: 'application/json' },
                    });
                    if (res.ok) {
                        const data = await res.json();
                        await Swal.fire({
                            icon: 'info',
                            title: `Chào mừng, ${data.user_name}!`,
                            text: 'Bạn đã đăng nhập. Đang chuyển về trang chủ...',
                            timer: 3000,
                            timerProgressBar: true,
                            showConfirmButton: false,
                            didOpen: () => {
                                const content = Swal.getHtmlContainer();
                                if (content) {
                                    content.style.marginBottom = '1rem';
                                }
                                Swal.showLoading();
                            },
                            willClose: () => {
                                window.location.href =
                                    data.role === 'admin' ? '/admin' : '/';
                            },
                        });
                    }
                } catch (err) {
                    console.warn('Không xác định trạng thái đăng nhập');
                }
            });

            document
                .getElementById('login-form')
                .addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const email = e.target.user_email.value;
                    const password = e.target.user_password.value;

                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({
                                user_email: email,
                                user_password: password,
                            }),
                        });

                        const data = await res.json();
                        if (res.ok) {
                            await Swal.fire({
                                icon: 'success',
                                title: 'Đăng nhập thành công!',
                                timer: 2000,
                                showConfirmButton: false,
                            });

                        if (data.redirect_url) {
                            window.location.href = data.redirect_url;
                        } else {
                            const isAdmin = data.user_role?.includes('admin');
                            window.location.href = isAdmin ? '/admin/' : '/';
                        }
                        } else {
                            await Swal.fire({
                                icon: 'error',
                                title: 'Đăng nhập thất bại',
                                text:
                                    data.error ||
                                    'Email hoặc mật khẩu không đúng',
                            });
                        }
                    } catch (err) {
                        await Swal.fire({
                            icon: 'error',
                            title: 'Lỗi kết nối',
                            text: 'Không thể kết nối đến máy chủ. Vui lòng thử lại sau.',
                        });
                    }
                });
        </script>
        <script>
            document
                .getElementById('togglePassword')
                .addEventListener('click', function () {
                    const passwordInput =
                        document.getElementById('user_password');
                    const icon = this;
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    icon.classList.toggle('bx-show');
                    icon.classList.toggle('bx-hide');
                });
        </script>
        {% if session.get('swal_message') %}
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                Swal.fire({
                    icon: '{{ session["swal_message"]["icon"] }}',
                    title: '{{ session["swal_message"]["title"] }}',
                    text: '{{ session["swal_message"]["text"] }}',
                    confirmButtonText: 'OK',
                });
            });
        </script>
        {% set _ = session.pop('swal_message') %} {% endif %}

        <!-- Footer Area -->
        {% include ('partials/footer.html') %}
        <!-- Footer Area End -->

        <!-- Jquery Min JS -->
        <script src="/static/assets/js/jquery.min.js"></script>
        <!-- Bootstrap Bundle Min JS -->
        <script src="/static/assets/js/bootstrap.bundle.min.js"></script>
        <!-- Meanmenu JS -->
        <script src="/static/assets/js/meanmenu.min.js"></script>
        <!-- Owl Carousel JS -->
        <script src="/static/assets/js/owl.carousel.min.js"></script>
        <!-- Magnific Popup JS -->
        <script src="/static/assets/js/jquery.magnific-popup.min.js"></script>
        <!-- Wow JS -->
        <script src="/static/assets/js/wow.min.js"></script>
        <!-- Ajaxchimp Min JS -->
        <script src="/static/assets/js/jquery.ajaxchimp.min.js"></script>
        <!-- Form Validator Min JS -->
        <script src="/static/assets/js/form-validator.min.js"></script>
        <!-- Contact Form JS -->
        <script src="/static/assets/js/contact-form-script.js"></script>
        <!-- Custom JS -->
        <script src="/static/assets/js/custom.js"></script>
    </body>
</html>
