<!-- @format -->

<!DOCTYPE html>
<html lang="zxx">
    <head>
        {% include ('partials/head.html')%}
    </head>
    <body>
        <!-- Start Navbar Sidebar Area -->
        {% include ('partials/narvar_sidebar.html') %}
        <!-- End Navbar Sidebar Modal -->
        <!-- Inner Banner End -->

        <!-- Start Sign In Area -->
        <section class="sign-in-area ptb-100">
            <div class="container">
                <div class="section-title text-center">
                    <h2>Sign In to your account!</h2>
                </div>
                <div class="contact-wrap-form log-in-width">
                    <form id="login-form" method="post">
                        <p>With your social network</p>
                        <div class="row justify-content-center">
                            <div class="col-lg-4 col-md-4 col-sm-4">
                                <button class="login-social-btn" type="button">
                                    <i class="bx bxl-google-plus"></i>
                                </button>
                            </div>

                            <div class="col-lg-4 col-md-4 col-sm-4">
                                <button class="login-social-btn" type="button">
                                    <i class="bx bxl-facebook"></i>
                                </button>
                            </div>

                            <div class="col-lg-4 col-md-4 col-sm-4">
                                <button class="login-social-btn" type="button">
                                    <i class="bx bxl-twitter"></i>
                                </button>
                            </div>

                            <div class="col-12">
                                <div class="form-group">
                                    <input
                                        class="form-control"
                                        type="email"
                                        name="user_email"
                                        placeholder="Email"
                                        required
                                    />
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-group">
                                    <input
                                        class="form-control"
                                        type="password"
                                        name="user_password"
                                        placeholder="Password"
                                        required
                                    />
                                </div>
                            </div>

                            <div class="col-lg-6 col-sm-6 form-condition">
                                <div class="agree-label">
                                    <input type="checkbox" id="chb1" />
                                    <label for="chb1"> Remember Me </label>
                                </div>
                            </div>

                            <div class="col-lg-6 col-sm-6">
                                <a class="forget" href="recover-password.html"
                                    >Forgot my password?</a
                                >
                            </div>

                            <div class="col-12 text-center">
                                <button
                                    class="default-btn btn-two"
                                    type="submit"
                                >
                                    Đăng Nhập
                                </button>
                            </div>

                            <div class="col-12">
                                <p class="account-desc">
                                    Chưa có tài khoản?
                                    <a href="/sign-up">Đăng ký tại đây</a>
                                </p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        <!-- End Sign In Area -->

        <script>
            document
                .getElementById('login-form')
                .addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const email = e.target.user_email.value;
                    const password = e.target.user_password.value;

                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                user_email: email,
                                user_password: password,
                            }),
                        });

                        const data = await res.json();
                        if (res.ok) {
                            alert('Đăng nhập thành công!');
                            if (data.role === 'admin') {
                                window.location.href = '/admin';
                            } else {
                                window.location.href = '/';
                            }
                        } else {
                            alert(data.error || 'Đăng nhập thất bại');
                        }
                    } catch (err) {
                        alert('Lỗi kết nối đến máy chủ.');
                    }
                });
        </script>

        <!-- Footer Area -->
        {% include ('partials/footer.html') %}
        <!-- Footer Area End -->

        <!-- Jquery Min JS -->
        <script src="/static/assets/js/jquery.min.js"></script>
        <!-- Bootstrap Bundle Min JS -->
        <script src="/static/assets/js/bootstrap.bundle.min.js"></script>
        <!-- Meanmenu JS -->
        <script src="/static/assets/js/meanmenu.min.js"></script>
        <!-- Owl Carousel JS -->
        <script src="/static/assets/js/owl.carousel.min.js"></script>
        <!-- Magnific Popup JS -->
        <script src="/static/assets/js/jquery.magnific-popup.min.js"></script>
        <!-- Wow JS -->
        <script src="/static/assets/js/wow.min.js"></script>
        <!-- Ajaxchimp Min JS -->
        <script src="/static/assets/js/jquery.ajaxchimp.min.js"></script>
        <!-- Form Validator Min JS -->
        <script src="/static/assets/js/form-validator.min.js"></script>
        <!-- Contact Form JS -->
        <script src="/static/assets/js/contact-form-script.js"></script>
        <!-- Custom JS -->
        <script src="/static/assets/js/custom.js"></script>
    </body>
</html>
