<!DOCTYPE html>
<html lang="zxx">
    <head>
        <!-- Required Meta Tags -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- CSS Resources -->
        <link rel="stylesheet" href="/static/assets/css/bootstrap.min.css" />
        <link
            rel="stylesheet"
            href="/static/assets/css/owl.theme.default.min.css"
        />
        <link rel="stylesheet" href="/static/assets/css/owl.carousel.min.css" />
        <link
            rel="stylesheet"
            href="/static/assets/css/magnific-popup.min.css"
        />
        <link rel="stylesheet" href="/static/assets/css/animate.min.css" />
        <link rel="stylesheet" href="/static/assets/css/boxicons.min.css" />
        <link rel="stylesheet" href="/static/assets/fonts/flaticon.css" />
        <link rel="stylesheet" href="/static/assets/css/meanmenu.min.css" />
        <link rel="stylesheet" href="/static/assets/css/style.css" />
        <link rel="stylesheet" href="/static/assets/css/responsive.css" />
        <link rel="stylesheet" href="/static/assets/css/theme-dark.css" />

        <title>403 - Không có quyền truy cập</title>
        <link
            rel="icon"
            type="image/png"
            href="/static/assets/img/favicon.png"
        />
    </head>
    <body>
        <!-- Start Preloader -->
        <div class="preloader">
            <div class="preloader-wave"></div>
        </div>
        <!-- End Preloader -->

        <!-- Start 403 Error -->
        <div class="error-area">
            <div class="d-table">
                <div class="d-table-cell">
                    <div class="error-content">
                        <h1>4 <span>0</span> 3</h1>
                        <h3>Không có quyền truy cập</h3>
                        <p>
                            Bạn không có quyền truy cập vào trang này. Vui lòng
                            đăng nhập với tài khoản phù hợp hoặc quay lại trang
                            chủ.
                        </p>
                        <a href="/" class="default-btn page-btn"
                            >Quay lại trang chủ</a
                        >
                    </div>
                </div>
            </div>
        </div>
        <!-- End 403 Error -->

        <!-- JS -->
        <script src="/static/assets/js/jquery.min.js"></script>
        <script src="/static/assets/js/bootstrap.bundle.min.js"></script>
        <script src="/static/assets/js/meanmenu.min.js"></script>
        <script src="/static/assets/js/owl.carousel.min.js"></script>
        <script src="/static/assets/js/jquery.magnific-popup.min.js"></script>
        <script src="/static/assets/js/wow.min.js"></script>
        <script src="/static/assets/js/jquery.ajaxchimp.min.js"></script>
        <script src="/static/assets/js/form-validator.min.js"></script>
        <script src="/static/assets/js/contact-form-script.js"></script>
        <script src="/static/assets/js/custom.js"></script>
    </body>
